# Per-file false positives, each with a reason (Moli standard 004, 4.7.3).
# Everything listed here is a fixture or a documentation example; no real credential.
# The CI scan reads the whole history (MoliKit's gitleaks action runs `detect` with fetch-depth 0),
# so paths that no longer exist stay listed: their old commits still hold the placeholder tokens.
# Do not reuse one of these paths for a new file.
[extend]
useDefault = true

[[allowlists]]
description = "API documentation and plans: curl examples with placeholder bearer tokens"
paths = [
  '''docs/guides/HTTP_API\.md''',
  '''docs/operations/hash-service-credentials-evidence\.md''',
  '''docs/superpowers/plans/.*\.md''',
]

[[allowlists]]
description = "Test fixtures: made-up tokens, passwords and keys that only exist inside tests"
paths = [
  '''tests/unit/lib/security/service-credential-token\.test\.ts''',
  '''tests/unit/scripts/hash-service-credentials\.test\.ts''',
  '''tests/integration/api/cron-daily-route\.test\.ts''',
  '''tests/integration/auth/bootstrap-couple\.test\.ts''',
  '''tests/integration/modules/source-document/server/source-document-submissions\.test\.ts''',
  '''scripts/validate-code-review-proposal\.mjs''',
]
