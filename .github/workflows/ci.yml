name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A commit the merge queue landed on main is the very commit the queue already tested (same SHA),
  # so the push run skips the checks instead of repeating them. Direct pushes run everything.
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.queue.outputs.skip }}
    steps:
      - id: queue
        uses: MoliDuo/MoliKit/actions/verified@52bbc8ec5c0e34f0bb97fa95dbcca5ffe298d07a # v1.2.0

  # The deploy follows a green ci on main, so this is the gate that matters. `npm run check` ends in a production build, which is what a bad dependency bump breaks.
  check:
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # setup-node caches npm by itself when package.json has packageManager
      - name: Install dependencies
        run: npm ci
      - name: Run the full gate
        run: npm run check

  gitleaks:
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The official image, not gitleaks-action (paid for organizations); .gitleaks.toml holds the
      # per-file false positives.
      - uses: MoliDuo/MoliKit/actions/gitleaks@52bbc8ec5c0e34f0bb97fa95dbcca5ffe298d07a # v1.2.0

  # The image is what actually runs: build it as the deploy does, start it with its database and
  # object store, and check that /healthz answers with the commit it was built from.
  build:
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Write throwaway settings
        run: |
          cat > ci.env <<'ENV'
          CASHIER_HOST=cashier.example.com
          APP_URL=https://cashier.example.com
          POSTGRES_PASSWORD=ci-throwaway-postgres
          S3_ACCESS_KEY_ID=ci-throwaway-key
          S3_SECRET_ACCESS_KEY=ci-throwaway-secret-value
          AUTH_SECRET=ci-throwaway-auth-secret-value-0123456789
          OPENAI_API_KEY=ci-throwaway
          OIDC_ISSUER_URL=https://auth.example.com
          OIDC_CLIENT_ID=moli-cashier
          OIDC_CLIENT_SECRET=ci-throwaway
          ENV
      - name: Build and start the stack
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker network create server-internal-net
          docker compose --env-file ci.env up -d --build --wait
      - name: Check /healthz reports this commit
        run: |
          body=$(docker compose --env-file ci.env exec -T cashier node -e 'fetch("http://127.0.0.1:3000/healthz").then((r) => r.text()).then(console.log)')
          echo "$body"
          [ "$body" = "{\"ok\":true,\"version\":\"${{ github.sha }}\"}" ]
      - name: Show the logs when it fails
        if: failure()
        run: docker compose --env-file ci.env logs --tail=100

  # A real browser against a real build is the slowest thing here.
  integration:
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # setup-node caches npm by itself when package.json has packageManager
      - name: Install dependencies
        run: npm ci
      # Chromium for the desktop and Android projects, WebKit for the iphone one.
      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run the smoke tests
        run: npm run test:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: smoke-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ci-gate:
    if: always()
    needs: [verified, check, gitleaks, build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: MoliDuo/MoliKit/actions/ci-gate@52bbc8ec5c0e34f0bb97fa95dbcca5ffe298d07a # v1.2.0
        with:
          needs: ${{ toJSON(needs) }}
