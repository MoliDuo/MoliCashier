# A two-person app behind a shared sign-in is far likelier to be reached through a
# dependency CVE than through its own code, and nothing else here watches for one. Updates are
# grouped and weekly so the pull requests stay readable: one for everyday version
# bumps, and a separate one for security fixes so those are never buried.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    # Majors land on their own, because they are the ones worth reading a
    # changelog for.
    ignore:
      # TypeScript 7 drops the JS compiler API. No repository script imports
      # it any more; typescript-eslint, which does, is what still has to
      # support TypeScript 7 first. dependency-cruiser parses TypeScript
      # through the same API (it accepts typescript <7), so check it too.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The runtime is Node 24 (engines and CI), so its types must not
      # outrun it and admit APIs that do not exist.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The Dockerfile pins its base image by digest; this moves the pin.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # The runtime is Node 24 (engines, .nvmrc and CI), and only even-numbered lines are LTS. A
      # new major is a deliberate move, not a weekly bump: this keeps Dependabot to the digest
      # and the minor and patch releases of the current line.
      - dependency-name: node
        update-types: [version-update:semver-major]
