name: MoliCashier
id: cashier
kind: web
level: L3

login:
  mode: P1
  client_id: moli-cashier

deploy:
  platform: docker
  domain: cashier.xiangyu.pro

data:
  db: postgres

release:
  kind: service

# License: AGPL-3.0-only today; the author has not decided whether to keep it (the standard default is
# all rights reserved), so it is left as is.
exceptions:
  - rule: "8.4.1"
    reason: One shared ledger and no per-user data, so nothing is keyed by user; the session keeps only the provider-verified email for display, not preferred_username
    until: 2027-03-31
  - rule: "8.5.5"
    reason: There is no local user table; the session is the identity, and who may sign in is decided by the Authelia client policy
    until: 2027-03-31
  - rule: "10.3.5"
    reason: The ledger is shared by everyone the Authelia client admits; there is no per-row owner column
    until: 2027-03-31
  - rule: "10.6.1"
    reason: Single-stage image on purpose, it ships tsx and sources so the same image runs migrations and scripts
    until: 2027-03-31
